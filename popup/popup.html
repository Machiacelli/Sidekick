<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sidekick</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #151617;
            --panel: #202224;
            --panel-hover: #282b2d;
            --border: #343739;
            --text: #f3f4f4;
            --muted: #8f9497;
            --green: #55c96a;
            --green-dark: #318c43;
            --amber: #f1aa3d;
            --red: #ef6262;
        }

        * {
            box-sizing: border-box;
            scrollbar-width: thin;
            scrollbar-color: #3b3e40 transparent;
        }

        body {
            width: 550px;
            height: 600px;
            margin: 0;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            font: 13px/1.4 "Segoe UI", Arial, sans-serif;
        }

        button,
        input {
            font: inherit;
        }

        button {
            color: inherit;
        }

        .shell {
            display: grid;
            grid-template-rows: 75px minmax(0, 1fr) 56px;
            height: 100%;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 14px 20px;
            border-bottom: 1px solid var(--border);
            background: #18191a;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .brand-logo {
            width: 116px;
            height: auto;
            display: block;
        }

        .version {
            color: var(--muted);
            font-size: 11px;
            white-space: nowrap;
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        .icon-button,
        .subtle-button,
        .primary-button,
        .footer-button {
            border: 1px solid var(--border);
            background: var(--panel);
            cursor: pointer;
            transition: border-color .15s ease, background .15s ease, transform .15s ease;
        }

        .icon-button:hover,
        .subtle-button:hover,
        .footer-button:hover {
            background: var(--panel-hover);
            border-color: #515557;
        }

        .icon-button:active,
        .subtle-button:active,
        .primary-button:active,
        .footer-button:active {
            transform: translateY(1px);
        }

        .icon-button {
            position: relative;
            width: 38px;
            height: 38px;
            display: grid;
            place-items: center;
            border-radius: 8px;
            padding: 0;
        }

        .icon-button img {
            width: 23px;
            height: 23px;
            object-fit: contain;
        }

        .notification-dot {
            position: absolute;
            top: 5px;
            right: 5px;
            min-width: 8px;
            height: 8px;
            padding: 0 3px;
            border-radius: 8px;
            background: var(--red);
            border: 2px solid #18191a;
        }

        .notification-dot[hidden] {
            display: none;
        }

        .content {
            min-height: 0;
            overflow: hidden;
        }

        .view {
            display: none;
            height: 100%;
            min-height: 0;
            padding: 20px;
        }

        .view.active {
            display: flex;
            flex-direction: column;
        }

        .view-heading {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 15px;
        }

        h1 {
            margin: 0 0 3px;
            font-size: 19px;
            line-height: 1.2;
            font-weight: 650;
        }

        .helper {
            margin: 0;
            color: var(--muted);
            font-size: 12px;
        }

        .subtle-button,
        .primary-button {
            min-height: 34px;
            padding: 7px 13px;
            border-radius: 7px;
            font-weight: 600;
            white-space: nowrap;
        }

        .primary-button {
            background: var(--green-dark);
            border-color: var(--green-dark);
        }

        .primary-button:hover {
            background: #3a9e4e;
        }

        .control-list,
        .customize-list,
        .notifications-list {
            min-height: 0;
            overflow-y: auto;
        }

        .control-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-right: 3px;
        }

        .control-row {
            min-height: 57px;
            display: grid;
            grid-template-columns: 38px minmax(0, 1fr) auto;
            align-items: center;
            gap: 12px;
            padding: 9px 13px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--panel);
        }

        .control-row:hover {
            background: var(--panel-hover);
            border-color: #424648;
        }

        .module-icon {
            width: 34px;
            height: 34px;
            display: grid;
            place-items: center;
            border-radius: 7px;
            background: #191a1b;
            border: 1px solid #303335;
        }

        .module-icon img {
            width: 26px;
            height: 26px;
            object-fit: contain;
        }

        .module-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-weight: 600;
        }

        .module-status {
            color: var(--muted);
            font-size: 11px;
            margin-top: 2px;
        }

        .module-status.enabled {
            color: var(--green);
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 42px;
            height: 24px;
        }

        .switch input {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        .switch-track {
            position: absolute;
            inset: 0;
            border-radius: 999px;
            background: #4b4f51;
            border: 1px solid #5a5e60;
            cursor: pointer;
            transition: background .18s ease, border-color .18s ease;
        }

        .switch-track::after {
            content: "";
            position: absolute;
            top: 3px;
            left: 3px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #f4f5f5;
            box-shadow: 0 1px 3px rgba(0, 0, 0, .45);
            transition: transform .18s ease;
        }

        .switch input:checked + .switch-track {
            background: var(--green-dark);
            border-color: var(--green);
        }

        .switch input:checked + .switch-track::after {
            transform: translateX(18px);
        }

        .switch input:focus-visible + .switch-track {
            outline: 2px solid #8ed79a;
            outline-offset: 2px;
        }

        .customize-toolbar {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .search-input {
            flex: 1;
            min-width: 0;
            height: 35px;
            padding: 0 11px;
            border: 1px solid var(--border);
            border-radius: 7px;
            background: #101112;
            color: var(--text);
            outline: none;
        }

        .search-input:focus {
            border-color: var(--green-dark);
            box-shadow: 0 0 0 2px rgba(85, 201, 106, .12);
        }

        .customize-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-right: 3px;
        }

        .picker-row {
            min-height: 48px;
            display: grid;
            grid-template-columns: 30px minmax(0, 1fr) auto;
            align-items: center;
            gap: 10px;
            padding: 7px 11px;
            border: 1px solid var(--border);
            border-radius: 7px;
            background: var(--panel);
            cursor: pointer;
        }

        .picker-row:hover {
            background: var(--panel-hover);
        }

        .picker-row img {
            width: 25px;
            height: 25px;
            object-fit: contain;
        }

        .picker-category {
            color: var(--muted);
            font-size: 11px;
        }

        .picker-row input {
            width: 17px;
            height: 17px;
            accent-color: var(--green);
        }

        .notifications-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-right: 3px;
        }

        .notification-card {
            padding: 11px 12px;
            border: 1px solid var(--border);
            border-left: 3px solid #5c9fe5;
            border-radius: 7px;
            background: var(--panel);
        }

        .notification-card.warning { border-left-color: var(--amber); }
        .notification-card.error { border-left-color: var(--red); }
        .notification-card.success { border-left-color: var(--green); }

        .notification-title-row {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .notification-title {
            font-weight: 600;
        }

        .notification-time,
        .notification-message {
            color: var(--muted);
            font-size: 11px;
        }

        .notification-message {
            margin-top: 4px;
            font-size: 12px;
        }

        .empty-state {
            margin: auto;
            color: var(--muted);
            text-align: center;
            padding: 40px 20px;
        }

        .footer {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px 20px;
            border-top: 1px solid var(--border);
            background: #18191a;
        }

        .footer-button {
            width: 100%;
            height: 35px;
            border-radius: 7px;
            color: #d9dcde;
            font-weight: 600;
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 64px;
            z-index: 10;
            transform: translate(-50%, 10px);
            max-width: 430px;
            padding: 8px 13px;
            border: 1px solid #4a4e50;
            border-radius: 7px;
            background: #292c2e;
            color: var(--text);
            opacity: 0;
            pointer-events: none;
            transition: opacity .16s ease, transform .16s ease;
            box-shadow: 0 6px 20px rgba(0, 0, 0, .35);
        }

        .toast.visible {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        .toast.error {
            border-color: var(--red);
        }

        [hidden] {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="shell">
        <header class="topbar">
            <div class="brand">
                <img class="brand-logo" src="../assets/icons/sidekick-logo.png" alt="Sidekick">
                <span class="version" id="versionText">Chrome Extension</span>
            </div>
            <div class="header-actions">
                <button class="icon-button" id="settingsButton" type="button" title="Open Sidekick settings" aria-label="Open Sidekick settings">
                    <img src="../assets/icons/General.png" alt="">
                </button>
                <button class="icon-button" id="notificationsButton" type="button" title="Notifications" aria-label="Open notifications">
                    <img src="../assets/icons/Events.png" alt="">
                    <span class="notification-dot" id="notificationDot" hidden></span>
                </button>
            </div>
        </header>

        <div class="content">
            <main class="view active" id="controlsView">
                <div class="view-heading">
                    <div>
                        <h1>Quick controls</h1>
                        <p class="helper">Your pinned Sidekick modules</p>
                    </div>
                    <button class="subtle-button" id="customizeButton" type="button">Customize</button>
                </div>
                <div class="control-list" id="controlList" aria-live="polite"></div>
            </main>

            <section class="view" id="customizeView" aria-labelledby="customizeTitle">
                <div class="view-heading">
                    <div>
                        <h1 id="customizeTitle">Choose controls</h1>
                        <p class="helper">Pin the switches you use most</p>
                    </div>
                    <button class="primary-button" id="customizeDoneButton" type="button">Done</button>
                </div>
                <div class="customize-toolbar">
                    <input class="search-input" id="moduleSearch" type="search" placeholder="Search modules" aria-label="Search modules">
                </div>
                <div class="customize-list" id="customizeList"></div>
            </section>

            <section class="view" id="notificationsView" aria-labelledby="notificationsTitle">
                <div class="view-heading">
                    <div>
                        <h1 id="notificationsTitle">Notifications</h1>
                        <p class="helper">Recent Sidekick activity</p>
                    </div>
                    <div>
                        <button class="subtle-button" id="clearNotificationsButton" type="button">Clear</button>
                        <button class="subtle-button" id="notificationsBackButton" type="button">Back</button>
                    </div>
                </div>
                <div class="notifications-list" id="notificationsList"></div>
                <div class="empty-state" id="notificationsEmpty" hidden>No notifications yet.</div>
            </section>
        </div>

        <footer class="footer">
            <button class="footer-button" id="reportBugButton" type="button">Report Bug</button>
        </footer>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="popup.js"></script>
</body>
</html>
